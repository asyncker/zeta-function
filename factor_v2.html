<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prime factorization</title>
  <style>
    body { font-family: system-ui, sans-serif;  margin: 0; padding: 4px 24px; background-color: #121212; color: #fff; box-sizing: border-box; min-height: 100vh; width: 100%; }
    input, select, button { background-color: #3B3B3B; border: 2px solid #444; }
    input { font-size: 1.1em; width: 26em; color: #fff; }
    button { font-size: 1.1em; cursor: pointer; padding: 0.3em 1em; color: #fff; }
    #out { font-size: 1.2em; margin-top: 1em; white-space: pre-wrap; }
    .mode-selector { appearance: none; margin-bottom: 0.8em; display: flex; flex-wrap: wrap; gap: 1.5em; align-items: center; }
    .mode-selector label { font-size: 1.1em; display: flex; align-items: center; gap: 0.3em; cursor: pointer; }
    .mode-selector input[type="radio"] { width: 1.1em; height: 1.1em; cursor: pointer; }
    .formula-inputs { display: flex; flex-direction: column; gap: 1em; }
    .var-row { display: flex; flex-wrap: wrap; gap: 0.8em; align-items: center; padding: 0.5em; border-radius: 6px; }
    .var-row b { min-width: 1.5em; font-size: 1.2em; color: #fff; }
    .var-row select, .var-row input { font-size: 1em; padding: 0.2em; color: #fff; }

    #b_table { width: 100%; text-align: left; margin-top: 1.5em; border-collapse: collapse; font-size: 1.1em; }
    #b_table th, #b_table td { padding: 0.6em; border: 1px solid #ccc; }
    #b_table th { background: #202020; cursor: pointer; user-select: none; }
    #b_table th:hover { background: #dcdcdc; }

</head>
<body>
  <h2>Prime factorization</h2>
  <div class="mode-selector">
    <label><input type="radio" name="mode" value="factor" checked> Factorize</label>
    <label><input type="radio" name="mode" value="prime"> Prime / Composite</label>
    <label><input type="radio" name="mode" value="formula"> Search primes</label>
    <label><input type="radio" name="mode" value="brute"> Brute-force formulas</label>
  </div>

  <div id="factorInputs">
    <input id="num" value="9999999900000001" oninput="run()">
  </div>
  
  <div id="formulaInputs" style="display:none;" class="formula-inputs">
    <label><input type="text" id="formulaExpr" value="1 * 2^n - 1" oninput="runFormula()"></label>
    <div style="display:flex; align-items:center; gap:1.5em; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:0.3em; width:auto; margin:0;">nmax:
        <input type="number" id="nmax" value="200" step="1" oninput="runFormula()" style="width:10em;">
      </label>
      <label style="display:flex; align-items:center; gap:0.3em; width:auto; margin:0; font-size:1.1em; cursor:pointer;">
        <input type="checkbox" id="nPrimeOnly" onchange="runFormula()" style="width:1.1em; height:1.1em; margin:0; cursor:pointer;">
        n = prime
      </label>
    </div>
  </div>

  <div id="bruteInputs" style="display:none;" class="formula-inputs">
    <label>Formula: <input type="text" id="b_formula" value="2 * 3 * a * 2^n - c * 5"></label>
    <label>nmax: <input type="number" id="b_nmax" value="200" style="width:10em;"></label>
    <div id="b_vars_container"></div>
    <div style="display:flex; gap:1em; margin-top: 0.5em; flex-wrap: wrap;">
      <button id="b_start">Start Brute-force</button>
      <button id="b_stop" disabled>Stop</button>
      <button id="b_clear">Clear Top</button>
      <button id="b_csv">Download CSV</button>
    </div>
    <div id="b_status">Waiting...</div>
    <table id="b_table">
      <thead>
        <tr>
          <th style="width: 70px;">Top</th>
          <th onclick="sortTable('formula')" style="cursor:pointer;">Formula <span id="sort_formula">▼</span></th>
          <th style="width: 200px;" onclick="sortTable('primes')" style="cursor:pointer;">Unique Primes <span id="sort_primes">▼</span></th>
          <th style="width: 220px;" onclick="sortTable('primesWhenNPrime')" style="cursor:pointer;">Primes (n is prime) <span id="sort_primesWhenNPrime"></span></th>
        </tr>
      </thead>
      <tbody id="b_table_body"></tbody>
    </table>
  </div>

  <div id="out"></div>

  <script type="text/worker" id="workerCode">
    function evalExpr(expr) {
      expr = expr.replace(/\s/g, '');
      if (!expr) return null;
      if (!/^[\d()+\-*/^!#]+$/.test(expr)) return null;
      const tokens = [];
      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];
        if (ch === '(' || ch === ')' || ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '^' || ch === '!' || ch === '#') {
          tokens.push(ch);
          i++;
        } else if (/\d/.test(ch)) {
          let num = '';
          while (i < expr.length && /\d/.test(expr[i])) {
            num += expr[i];
            i++;
          }
          tokens.push(num);
        } else return null;
      }
      const output = [];
      const stack = [];
      const precedence = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3, '!': 4, '#': 4 };
      for (const token of tokens) {
        if (/^\d+$/.test(token)) output.push(token);
        else if (token === '(') stack.push(token);
        else if (token === ')') {
          while (stack.length && stack[stack.length - 1] !== '(') output.push(stack.pop());
          if (stack.length && stack[stack.length - 1] === '(') stack.pop();
          else return null;
        } else if (token === '!' || token === '#') output.push(token);
        else {
          while (stack.length && stack[stack.length - 1] !== '(' && precedence[stack[stack.length - 1]] >= precedence[token]) {
            output.push(stack.pop());
          }
          stack.push(token);
        }
      }
      while (stack.length) {
        const op = stack.pop();
        if (op === '(' || op === ')') return null;
        output.push(op);
      }
      const evalStack = [];
      for (const token of output) {
        if (/^\d+$/.test(token)) evalStack.push(BigInt(token));
        else if (token === '!' || token === '#') {
          if (evalStack.length < 1) return null;
          const a = evalStack.pop();
          if (a > 2000n) return null;
          let r = 1n;
          if (token === '!') {
            for (let j = 2n; j <= a; j++) r *= j;
          } else {
            let limit = Number(a);
            let pr = primesArr(limit);
            for (let j = 0; j < pr.length; j++) r *= pr[j];
          }
          evalStack.push(r);
        } else {
          if (evalStack.length < 2) return null;
          const b = evalStack.pop();
          const a = evalStack.pop();
          let result;
          if (token === '+') result = a + b;
          else if (token === '-') result = a - b;
          else if (token === '*') result = a * b;
          else if (token === '/') {
            if (b === 0n) return null;
            result = a / b;
          } else if (token === '^') {
            if (b < 0n || b > 10000n || a > 1000000n) return null;
            result = 1n;
            let base = a;
            let exp = b;
            while (exp > 0n) {
              if (exp & 1n) result *= base;
              base *= base;
              exp >>= 1n;
            }
          }
          evalStack.push(result);
        }
      }
      if (evalStack.length !== 1) return null;
      return evalStack[0];
    }

    function modPow(base, exp, mod) {
      let result = 1n;
      base %= mod;
      while (exp > 0n) {
        if (exp & 1n) result = (result * base) % mod;
        base = (base * base) % mod;
        exp >>= 1n;
      }
      return result;
    }

    function isPrimeTest(n) {
      if (n < 9007199254740991n) {
        const num = Number(n);
        if (num < 2) return false;
        if (num % 2 === 0) return num === 2;
        if (num % 3 === 0) return num === 3;
        for (let i = 5; i * i <= num; i += 6) {
          if (num % i === 0 || num % (i + 2) === 0) return false;
        }
        return true;
      }
      const small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n, 53n, 59n, 61n, 67n, 71n, 73n, 79n, 83n, 89n, 97n];
      for (const p of small) {
        if (n % p === 0n) return n === p;
      }
      let d = n - 1n;
      let s = 0n;
      while ((d & 1n) === 0n) {
        d >>= 1n;
        s++;
      }
      const witnesses = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
      for (let a of witnesses) {
        a %= n;
        if (a === 0n) continue;
        let x = modPow(a, d, n);
        if (x === 1n || x === n - 1n) continue;
        let composite = true;
        for (let r = 1n; r < s; r++) {
          x = (x * x) % n;
          if (x === n - 1n) {
            composite = false;
            break;
          }
        }
        if (composite) return false;
      }
      return true;
    }

    function isPrimeNum(n) {
      n = Math.abs(n);
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) {
        if (n % i === 0) return false;
      }
      return true;
    }

    function primesArr(limit) {
      const res = [];
      let num = 2n;
      while (res.length < limit) {
        if (isPrimeTest(num)) res.push(num);
        num++;
      }
      return res;
    }

    onmessage = function(e) {
      const { formula, nmax, varsObj } = e.data;
      const keys = Object.keys(varsObj);
      const vals = {};
      const isAnyRandom = keys.some(k => varsObj[k].order === 'rand');
      
      for (let k of keys) {
        let arr = [];
        let config = varsObj[k];
        for (let i = config.min; i <= config.max; i++) {
          if (config.type === 'prime') {
            if (Math.abs(i) < 2) continue;
            if (!isPrimeNum(i)) continue;
          }
          arr.push(i);
        }
        vals[k] = arr;
      }

      if (isAnyRandom) {
        const totalTrials = 50000;
        let count = 0;

        for (let step = 0; step < totalTrials; step++) {
          let currentMap = {};
          let validCombo = true;
          for (let k of keys) {
            let arr = vals[k];
            if (arr.length === 0) { validCombo = false; break; }
            if (varsObj[k].order === 'rand') {
              currentMap[k] = arr[Math.floor(Math.random() * arr.length)];
            } else {
              currentMap[k] = arr[step % arr.length];
            }
          }

          if (validCombo) {
            let replaced = formula;
            for (let k of keys) {
              let val = currentMap[k];
              let strVal = val < 0 ? "(0-" + (-val) + ")" : String(val);
              replaced = replaced.split(k).join(strVal);
            }

            let primesFound = new Set();
            let primesWhenNPrimeCount = 0;
            let splitReplaced = replaced.split("n");
            for (let n = 0; n <= nmax; n++) {
              let expr = splitReplaced.join(String(n));
              try {
                let res = evalExpr(expr);
                if (res !== null && res >= 2n && isPrimeTest(res)) {
                  primesFound.add(res.toString());
                  if (isPrimeTest(BigInt(n))) {
                    primesWhenNPrimeCount++;
                  }
                }
              } catch (err) {}
            }

            if (primesFound.size > 0) {
              postMessage({ 
                formula: replaced, 
                primes: primesFound.size, 
                primesWhenNPrime: primesWhenNPrimeCount 
              });
            }
          }

          count++;
          if (count % 100 === 0) postMessage({ progress: count, total: totalTrials });
        }
        postMessage({ done: true });
      } else {
        let total = 1;
        for (let k of keys) total *= vals[k].length;
        let count = 0;

        function runCombo(idx, currentMap) {
          if (idx === keys.length) {
            let replaced = formula;
            for (let k of keys) {
              let val = currentMap[k];
              let strVal = val < 0 ? "(0-" + (-val) + ")" : String(val);
              replaced = replaced.split(k).join(strVal);
            }

            let primesFound = new Set();
            let primesWhenNPrimeCount = 0;

            for (let n = 0; n <= nmax; n++) {
              let expr = replaced.split("n").join(String(n));
              try {
                let res = evalExpr(expr);
                if (res !== null && res >= 2n && isPrimeTest(res)) {
                  primesFound.add(res.toString());
                  if (isPrimeTest(BigInt(n))) {
                    primesWhenNPrimeCount++;
                  }
                }
              } catch (err) {}
            }

            if (primesFound.size > 0) {
              postMessage({ 
                formula: replaced, 
                primes: primesFound.size, 
                primesWhenNPrime: primesWhenNPrimeCount 
              });
            }

            count++;
            if (count % 100 === 0) postMessage({ progress: count, total: total });
            return;
          }

          let k = keys[idx];
          for (let v of vals[k]) {
            currentMap[k] = v;
            runCombo(idx + 1, currentMap);
          }
        }

        runCombo(0, {});
        postMessage({ done: true, total: total });
      }
    };
  </script>

  <script>
    "use strict";

    function evalExpr(expr) {
      expr = expr.replace(/\s/g, '');
      if (!expr) return null;
      if (!/^[\d()+\-*/^!#]+$/.test(expr)) return null;
      const tokens = [];
      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];
        if (ch === '(' || ch === ')' || ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '^' || ch === '!' || ch === '#') {
          tokens.push(ch);
          i++;
        } else if (/\d/.test(ch)) {
          let num = '';
          while (i < expr.length && /\d/.test(expr[i])) {
            num += expr[i];
            i++;
          }
          tokens.push(num);
        } else return null;
      }
      const output = [];
      const stack = [];
      const precedence = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3, '!': 4, '#': 4 };
      for (const token of tokens) {
        if (/^\d+$/.test(token)) output.push(token);
        else if (token === '(') stack.push(token);
        else if (token === ')') {
          while (stack.length && stack[stack.length - 1] !== '(') output.push(stack.pop());
          if (stack.length && stack[stack.length - 1] === '(') stack.pop();
          else return null;
        } else if (token === '!' || token === '#') output.push(token);
        else {
          while (stack.length && stack[stack.length - 1] !== '(' && precedence[stack[stack.length - 1]] >= precedence[token]) {
            output.push(stack.pop());
          }
          stack.push(token);
        }
      }
      while (stack.length) {
        const op = stack.pop();
        if (op === '(' || op === ')') return null;
        output.push(op);
      }
      const evalStack = [];
      for (const token of output) {
        if (/^\d+$/.test(token)) evalStack.push(BigInt(token));
        else if (token === '!' || token === '#') {
          if (evalStack.length < 1) return null;
          const a = evalStack.pop();
          const result = token === '!' ? factorial(a) : primorial(a);
          if (result === null) return null;
          evalStack.push(result);
        } else {
          if (evalStack.length < 2) return null;
          const b = evalStack.pop();
          const a = evalStack.pop();
          let result;
          switch (token) {
            case '+': result = a + b; break;
            case '-': result = a - b; break;
            case '*': result = a * b; break;
            case '/': if (b === 0n) return null; result = a / b; break;
            case '^':
              if (b < 0n) return null;
              if (b === 0n) result = 1n;
              else {
                result = 1n;
                for (let j = 0n; j < b; j++) result *= a;
              }
              break;
            default: return null;
          }
          evalStack.push(result);
        }
      }
      if (evalStack.length !== 1) return null;
      return evalStack[0];
    }

    function factorial(n) {
      let r = 1n;
      for (let i = 2n; i <= n; i++) r *= i;
      return r;
    }

    function primes(count) {
      const result = [];
      let num = 2n;
      while (result.length < count) {
        if (isPrime(num)) result.push(num);
        num++;
      }
      return result;
    }

    function primorial(n) {
      const pList = primes(Number(n));
      let r = 1n;
      for (let i = 0; i < pList.length; i++) r *= pList[i];
      return r;
    }

    function gcd(a, b) {
      a = a < 0n ? -a : a;
      b = b < 0n ? -b : b;
      while (b !== 0n) {
        const t = a % b;
        a = b;
        b = t;
      }
      return a;
    }

    function modPow(base, exp, mod) {
      let result = 1n;
      base %= mod;
      while (exp > 0n) {
        if (exp & 1n) result = (result * base) % mod;
        base = (base * base) % mod;
        exp >>= 1n;
      }
      return result;
    }

    function isPrime(n) {
      if (n < 2n) return false;
      const small = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n, 53n, 59n, 61n, 67n, 71n, 73n, 79n, 83n, 89n, 97n];
      for (const p of small) {
        if (n % p === 0n) return n === p;
      }
      let d = n - 1n;
      let s = 0n;
      while ((d & 1n) === 0n) {
        d >>= 1n;
        s++;
      }
      const witnesses = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
      for (let a of witnesses) {
        a %= n;
        if (a === 0n) continue;
        let x = modPow(a, d, n);
        if (x === 1n || x === n - 1n) continue;
        let composite = true;
        for (let r = 1n; r < s; r++) {
          x = (x * x) % n;
          if (x === n - 1n) {
            composite = false;
            break;
          }
        }
        if (composite) return false;
      }
      return true;
    }

    function pollardRho(n) {
      if (n % 2n === 0n) return 2n;
      let c = 1n;
      while (true) {
        let x = 2n;
        let y = 2n;
        let d = 1n;
        const f = (x) => (x * x + c) % n;
        while (d === 1n) {
          x = f(x);
          y = f(f(y));
          const diff = x > y ? x - y : y - x;
          d = gcd(diff, n);
        }
        if (d !== n) return d;
        c++;
      }
    }

    function primesUpTo(limit) {
      const sieve = new Uint8Array(limit + 1);
      const primesArrList = [];
      for (let i = 2; i <= limit; i++) {
        if (!sieve[i]) {
          primesArrList.push(BigInt(i));
          if (i * i <= limit) {
            for (let j = i * i; j <= limit; j += i) sieve[j] = 1;
          }
        }
      }
      return primesArrList;
    }

    const smallPrimeList = primesUpTo(100000);

    function factorList(n) {
      let factors = [];
      for (const p of smallPrimeList) {
        if (n === 1n) break;
        if (p * p > n) break;
        while (n % p === 0n) {
          factors.push(p);
          n /= p;
        }
      }
      if (n === 1n) return factors;
      if (isPrime(n)) {
        factors.push(n);
        return factors;
      }
      const d = pollardRho(n);
      return factors.concat(factorList(d), factorList(n / d));
    }

    function factorize(n) {
      if (n == 0n) return [[0n, -1]];
      if (n == 1n) return [[1n, 0]];
      if (n < 2n) return [];
      const list = factorList(n).sort((a, b) => (a < b ? -1 : 1));
      const map = new Map();
      for (const p of list) {
        map.set(p, (map.get(p) || 0) + 1);
      }
      return [...map.entries()];
    }

    function toggleInputs() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      document.getElementById("factorInputs").style.display = (mode === "factor" || mode === "prime") ? "block" : "none";
      document.getElementById("formulaInputs").style.display = (mode === "formula") ? "flex" : "none";
      document.getElementById("bruteInputs").style.display = (mode === "brute") ? "flex" : "none";
      document.getElementById("out").style.display = (mode === "brute") ? "none" : "block";
    }

    function run() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      if (mode === "formula" || mode === "brute") {
        if (mode === "formula") runFormula();
        return;
      }
      const out = document.getElementById("out");
      const raw = document.getElementById("num").value;
      if (!raw) { out.textContent = "Enter an integer"; return; }
      try {
        const n = evalExpr(raw);
        if (n === null) return;
        if (n < 2n) { out.textContent = "The number must be greater than 1."; return; }
        if (mode === "prime") { out.textContent = String(n) + (isPrime(n) ? " is prime." : ""); return; }
        const factors = factorize(n);
        const expression = factors.map(([p, e]) => String(p) + (e > 1 ? "<sup>" + e + "</sup>" : "")).join(" × ");
        const primeNote = factors.length === 1 && factors[0][1] === 1 ? " is prime." : "";
        out.innerHTML = String(n) + " = " + expression + primeNote;
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    }

    function runFormula() {
      const out = document.getElementById("out");
      const expr = document.getElementById("formulaExpr").value.trim();
      const nmax = parseInt(document.getElementById("nmax").value, 10);
      const nPrimeOnly = document.getElementById("nPrimeOnly").checked;
      if (!expr) { out.textContent = "Enter a formula (use n)"; return; }
      if (isNaN(nmax) || nmax < 1) { out.textContent = "nmax must be >= 1"; return; }
      const results = [];
      const nprimes = [];
      for (let n = 0; n <= nmax; n++) {
        if (nPrimeOnly && !isPrime(BigInt(n))) continue;
        try {
          const val = evalExpr(expr.replace(/n/g, String(n)));
          if (val === null) continue;
          if (val < 2n) continue;
          if (isPrime(val)) {
            results.push({ n, value: val });
            nprimes.push(BigInt(n));
          }
        } catch (_) {}
      }
      if (results.length === 0) {
        out.textContent = `No primes found for n = 1..${nmax}`;
      } else {
        let text = `Primes found (n = 1..${nmax}):\n`;
        text += results.map(({n, value}) => `n=${n}: ${value}`).join("\n");
        text += "\n\nFactorize n get primes:\n";
        for (let i = 0; i < nprimes.length; i++) {
          const n = nprimes[i];
          const factors = factorize(n);
          const expression = factors.map(([p, e]) => String(p) + (e > 1 ? "<sup>" + e + "</sup>" : "")).join(" × ");
          const primeNote = factors.length === 1 && factors[0][1] === 1 ? " is prime." : "";
          text += String(n) + " = " + expression + primeNote + "\n";
        }
        text += "\n {" + nprimes.map(x => x).join(", ") + "}";
        text += "\n {" + nprimes.filter(x => isPrime(x)).map(x => x).join(", ") + "}";
        out.innerHTML = text;
      }
    }

    document.querySelectorAll('input[name="mode"]').forEach(el => {
      el.addEventListener("change", () => { toggleInputs(); run(); });
    });

    document.getElementById("b_formula").addEventListener("input", function() {
      const formula = this.value;
      const match = formula.replace(/n/g, '').match(/[a-zA-Z]/g);
      const uniqueVars = [...new Set(match || [])];
      const container = document.getElementById("b_vars_container");
      let htmlDom = "";
      uniqueVars.forEach(v => {
        htmlDom += `
          <div class="var-row" data-var="${v}">
            <b>${v}:</b>
            <select class="v-type">
              <option value="nat">Natural</option>
              <option value="prime">Prime</option>
            </select>
            <select class="v-order">
              <option value="seq">Sequential</option>
              <option value="rand">Random</option>
            </select>
            Min: <input type="number" class="v-min" value="1">
            Max: <input type="number" class="v-max" value="10">
          </div>
        `;
      });
      container.innerHTML = htmlDom;
    });

    let b_worker = null;
    let b_interval = null;
    let b_top = JSON.parse(localStorage.getItem('b_top') || '[]').map(x => ({
      formula: x.f,
      primes: x.p,
      primesWhenNPrime: x.pp || 0
    }));
    let b_top_map = new Map();
    b_top.forEach(x => b_top_map.set(x.formula, x));
    let currentSortField = 'primes';
    let formulaSortDir = 'asc';
    function sortTable(field) {
      if (field === 'formula') {
        formulaSortDir = formulaSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortField = field;
      }
      renderBTable();
    }

    function renderBTable() {
      b_top.sort((a, b) => {
        if (currentSortField === 'formula') {
          return formulaSortDir === 'asc' ? a.formula.localeCompare(b.formula) : b.formula.localeCompare(a.formula);
        } else if (currentSortField === 'primes') {
          if (b.primes !== a.primes) return b.primes - a.primes;
          return (b.primesWhenNPrime || 0) - (a.primesWhenNPrime || 0);
        } else if (currentSortField === 'primesWhenNPrime') {
          const valA = a.primesWhenNPrime || 0;
          const valB = b.primesWhenNPrime || 0;
          if (valB !== valA) return valB - valA;
          return b.primes - a.primes;
        }
        return b.primes - a.primes;
      });

      b_top = b_top.slice(0, 25000);
      const compactData = b_top.map(x => ({ f: x.formula, p: x.primes, pp: x.primesWhenNPrime || 0 }));
      localStorage.setItem('b_top', JSON.stringify(compactData));
      
      b_top_map.clear();
      b_top.forEach(x => b_top_map.set(x.formula, x));
      document.getElementById('sort_formula').textContent = currentSortField === 'formula' ? (formulaSortDir === 'asc' ? '▲' : '▼') : '';
      document.getElementById('sort_primes').textContent = currentSortField === 'primes' ? '▼' : '';
      document.getElementById('sort_primesWhenNPrime').textContent = currentSortField === 'primesWhenNPrime' ? '▼' : '';

      const tbody = document.getElementById('b_table_body');
      tbody.innerHTML = b_top.map((row, i) => `
        <tr>
          <td>${i+1}</td>
          <td>${row.formula}</td>
          <td>${row.primes}</td>
          <td>${row.primesWhenNPrime || 0}</td>
        </tr>
      `).join('');
    }

    document.getElementById('b_start').addEventListener("click", function() {
      if (b_worker) b_worker.terminate();
      document.getElementById('b_stop').disabled = false;
      document.getElementById('b_start').disabled = true;
      document.getElementById('b_status').textContent = "Running...";
      const formula = document.getElementById('b_formula').value;
      const nmax = parseInt(document.getElementById('b_nmax').value);
      const varsObj = {};
      document.querySelectorAll('.var-row').forEach(row => {
        const v = row.getAttribute('data-var');
        varsObj[v] = {
          type: row.querySelector('.v-type').value,
          order: row.querySelector('.v-order').value,
          min: parseInt(row.querySelector('.v-min').value),
          max: parseInt(row.querySelector('.v-max').value)
        };
      });

      const blob = new Blob([document.getElementById('workerCode').textContent], { type: 'application/javascript' });
      b_worker = new Worker(URL.createObjectURL(blob));

      b_worker.onmessage = function(e) {
        if (e.data.formula) {
          let existing = b_top_map.get(e.data.formula);
          if (!existing) {
            let newItem = { 
              formula: e.data.formula, 
              primes: e.data.primes, 
              primesWhenNPrime: e.data.primesWhenNPrime 
            };
            b_top.push(newItem);
            b_top_map.set(e.data.formula, newItem);
          } else {
            existing.primes = e.data.primes;
            existing.primesWhenNPrime = e.data.primesWhenNPrime;
          }
        } else if (e.data.progress) {
          document.getElementById('b_status').textContent = `Progress: ${e.data.progress} / ${e.data.total}`;
        } else if (e.data.done) {
          document.getElementById('b_status').textContent = "Done!";
          document.getElementById('b_stop').disabled = true;
          document.getElementById('b_start').disabled = false;
          clearInterval(b_interval);
          renderBTable();
        }
      };

      if (b_interval) clearInterval(b_interval);
      b_interval = setInterval(renderBTable, 9000);
      b_worker.postMessage({ formula, nmax, varsObj });
    });

    document.getElementById('b_stop').addEventListener("click", function() {
      if (b_worker) b_worker.terminate();
      if (b_interval) clearInterval(b_interval);
      document.getElementById('b_stop').disabled = true;
      document.getElementById('b_start').disabled = false;
      document.getElementById('b_status').textContent = "Stopped";
      renderBTable();
    });

    document.getElementById('b_clear').addEventListener("click", function() {
      b_top = [];
      b_top_map.clear();
      renderBTable();
    });

    document.getElementById('b_csv').addEventListener("click", function() {
      let csvContent = "formula,primes,primesWhenNPrime\n";
      const len = Math.min(b_top.length, 16006);
      for (let i = 0; i < len; i++) {
        const row = b_top[i];
        let f = row.formula;
        if (f.includes(',') || f.includes('"')) {
          f = `"${f.replace(/"/g, '""')}"`;
        }
        csvContent += f + ',' + row.primes + ',' + (row.primesWhenNPrime || 0) + '\n';
      }
      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "prime_brute_top.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById("b_formula").dispatchEvent(new Event("input"));
    toggleInputs();
    run();
    renderBTable();
  </script>
</body>
</html>
